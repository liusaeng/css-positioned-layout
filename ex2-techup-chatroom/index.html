<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet" />
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  <header class="chatroom-header">Techup Chatroom</header>

  <main class="chatroom-body">
    <div class="message-row right">
      <div class="bubble bubble-green bubble-tail">สวัสดีจ้า</div>
    </div>

    <div class="message-row right">
      <div class="bubble bubble-light-gray">
        Coding สนุกจังเลย
        <button class="close-btn" type="button" aria-label="Close">×</button>
      </div>
    </div>

    <div class="message-row right">
      <div class="bubble bubble-green">🥳 😍</div>
    </div>

    <div class="message-row left">
      <div class="bubble bubble-gray">😍</div>
    </div>

    <div class="message-row left">
      <div class="bubble bubble-gray">😘</div>
    </div>
  </main>
</body>

</html>
