<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <script
      src="https://kit.fontawesome.com/bf7220ad33.js"
      crossorigin="anonymous"
    ></script>
    <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
  </head>

  <body>
    <!-- Start coding here -->
    <section class="chatroom">
      <header class="chatroom-header">
        <h1>Techup Chatroom</h1>
      </header>

      <main class="chatroom-body">
        <div class="message-row message-row--right">
          <div class="bubble bubble--green">
            <p>สวัสดีจ้า</p>
          </div>
        </div>

        <div class="message-row message-row--right">
          <div class="bubble bubble--gray-light">
            <p>Coding สนุกจังเลย</p>
            <button type="button" class="close-btn" aria-label="ปิดข้อความ">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
        </div>

        <div class="message-row message-row--right">
          <div class="bubble bubble--green bubble--green-emoji">
            <p>🥳😍</p>
          </div>
        </div>

        <div class="message-row message-row--left">
          <div class="bubble bubble--gray-pill">🤩</div>
        </div>

        <div class="message-row message-row--left">
          <div class="bubble bubble--gray-pill">🐥</div>
        </div>
      </main>
    </section>
  </body>
</html>
